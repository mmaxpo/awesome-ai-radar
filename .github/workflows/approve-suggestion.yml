name: Approve suggestion

# The repo owner comments "/approve" on a "Suggest a repo" issue
# (or "/approve agents" to choose the category). The repo is added and the issue is closed.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/approve') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Add repo from the issue
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body }}
        run: python scripts/approve_suggestion.py

      - name: Refresh radar
        if: steps.add.outputs.added == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update.py

      - name: Commit changes
        if: steps.add.outputs.added == 'true'
        env:
          REPO_NAME: ${{ steps.add.outputs.repo }}
        run: |
          git config user.name "repo-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md repos.yml repos.csv repos/ weekly/
          git commit -m "Add $REPO_NAME (suggested in #${{ github.event.issue.number }})"
          git pull --rebase -q origin main
          git push

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ steps.add.outputs.message }}
          ADDED: ${{ steps.add.outputs.added }}
          REPO_NAME: ${{ steps.add.outputs.repo }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          if [ -n "$REPO_NAME" ]; then
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
